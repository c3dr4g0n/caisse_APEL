<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<meta name="theme-color" content="#FF9800">
		<title>Caisse APEL - ACCUEIL</title>
		<link rel="stylesheet" href="style.css" />
		<link rel="manifest" href="manifest.json" />
		<link rel="icon" sizes="192x192" href="images/icone_192.png" />
		<style>
			.accueil_bloc{
				display:flex;
				flex-direction:column;
				align-items:center;
				justify-content:center;
				min-height:80vh;
			}
			
			.accueil_bloc button{
				width:80%;
				max-width:400px;
				margin:15px 0;
				padding:30px;
				font-size:1.5rem;
			}
		</style>
	</head>
	<body>
		<div class="boutons_options">
			<button id="bouton_mode_nuit" onclick="changerModeJourNuit()"></button>
		</div>
		<h1>Caisse APEL - ACCUEIL</h1>
		<h2 id="version"></h2>
		<div class="accueil_bloc">
			<h2>Choisissez votre évènement :</h2>
			<button onclick="window.location.href='marche_de_noel.html'" style="background:#4caf50;color:white;">Marché de Noël</button>
			<button onclick="window.location.href='caisse_fete_de_saint_paul.html'" style="background:#1565c0;color:white;">Fête de Saint Paul</button>
			<button onclick="window.location.href='fond_de_caisse.html'" style="background:#9c27b0;color:white;">Fond de caisse</button>
		</div>
		<script>
			if("serviceWorker" in navigator){
				navigator.serviceWorker
					.register("sw.js")
					.then(() => {
						console.log("Service Worker enregistré");
						
						navigator.serviceWorker.addEventListener("message", (event) => {
							if (event.data?.version) {
								document.getElementById("version").textContent = "Version " + event.data.version;
							}
						});
						
						if (navigator.serviceWorker.controller) {
							navigator.serviceWorker.controller.postMessage("getVersion");
						}
					})
					.catch(err => console.error("Erreur du Service Worker : ", err));
			}
		</script>
		<script src="script.js"></script>
	</body>
</html>
